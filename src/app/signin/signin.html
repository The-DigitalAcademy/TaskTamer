<form class="signup-form">
    <div class="welcome"><strong>Welcome Back to TaskTamer!</strong></div>
    <p>
        <input type="email"  id="email" placeholder="Enter your email">
    </p>
    <p>
      
        <input type="password" id="password" placeholder="Create new password">
    </p>
    <div>
        <button class="signin-btn">Sign In</button>
    </div>
    <p class="signup-redirect">
        New to TaskTamer? <a routerLink="/signup"><strong>Sign Up</strong></a>
    </p>
</form>
