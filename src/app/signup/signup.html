<form class="signup-form">
    <div class="welcome"><strong>Welcome to TaskTamer!</strong></div>

    <p>
        <input type="text" id="username" placeholder="Enter your name">
    </p>
    <p>
        <input type="text" id="surname" placeholder="Enter your surname">
    </p>
    <p>
        <input type="email"  id="email" placeholder="Enter your email">
    </p>
    <p>
      
        <input type="password" id="password" placeholder="Create new password">
    </p>
    <div>
        <button class="signup-btn">Sign Up</button>
    </div>
    <p class="signin-redirect">
        Already have a TaskTamer account? <a routerLink="/signin"><strong>Sign In</strong></a>
    </p>
</form>
